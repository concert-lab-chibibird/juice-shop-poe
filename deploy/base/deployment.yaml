apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop-poe
  labels:
    app.kubernetes.io/name: juice-shop
    app.kubernetes.io/instance: juice-shop-poe
    app.kubernetes.io/version: "20.3.0"
    app.kubernetes.io/part-of: concert-poe-reference

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: juice-shop
      app.kubernetes.io/instance: juice-shop-poe

  template:
    metadata:
      labels:
        app.kubernetes.io/name: juice-shop
        app.kubernetes.io/instance: juice-shop-poe
        app.kubernetes.io/version: "20.3.0"
        app.kubernetes.io/part-of: concert-poe-reference

    spec:
      containers:
        - name: juice-shop
          image: docker.io/chibibird/juice-shop-poe:20.3.0-amd64-test
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
